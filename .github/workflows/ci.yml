name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'
  workflow_call:

permissions: {}

jobs:
  ci:
    uses: PruvoNet/oss-workflows/.github/workflows/ci-node.yml@638c70a621e280086c02bc7dcf4ccca4580d9041 # v1
    permissions:
      contents: read
    with:
      package-manager: yarn
      node-versions: '["6.x", "8.x", "10.x", "12.x", "14.x", "16.x", "18.x", "20.x", "22.x", "24.x"]'
      build-command: yarn build
      test-command: yarn test:unit
      coverage-command: yarn test:cover

  zizmor:
    uses: PruvoNet/oss-workflows/.github/workflows/zizmor.yml@638c70a621e280086c02bc7dcf4ccca4580d9041 # v1
    permissions:
      contents: read
